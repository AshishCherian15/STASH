[versions]
androidGradlePlugin = "8.9.1"
androidxCore = "1.13.1"
androidxLifecycle = "2.8.6"
androidxActivity = "1.9.3"
androidxComposeBom = "2024.10.00"
androidxTest = "1.6.1"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.1"
androidxTestEspresso = "3.6.1"
coroutines = "1.9.0"
junit = "4.13.2"
kotlin = "2.0.21"
navigation = "2.8.1"
# Added for Stash
hilt                    = "2.52"
hiltNavigationCompose   = "1.2.0"
hiltWork                = "1.2.0"
ksp                     = "2.0.21-1.0.25"
room                    = "2.6.1"
coil                    = "2.7.0"
archTesting             = "2.2.0"
mlKit                   = "16.0.1"
workManager             = "2.9.1"
biometric               = "1.1.0"
dataStore               = "1.1.1"
kotlinSerialization     = "1.7.3"
playServicesCoroutines = "1.9.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "playServicesCoroutines" }
# Hilt
hilt-android        = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt" }
hilt-compiler       = { group = "com.google.dagger", name = "hilt-android-compiler",   version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-work           = { group = "androidx.hilt", name = "hilt-work",                 version.ref = "hiltWork" }
hilt-work-compiler  = { group = "androidx.hilt", name = "hilt-compiler",             version.ref = "hiltWork" }
# Room
room-runtime        = { group = "androidx.room",      name = "room-runtime",           version.ref = "room" }
room-ktx            = { group = "androidx.room",      name = "room-ktx",               version.ref = "room" }
room-compiler       = { group = "androidx.room",      name = "room-compiler",          version.ref = "room" }
room-testing        = { group = "androidx.room",      name = "room-testing",           version.ref = "room" }
# Coil image loading; thumbnail use starts Week 3
coil-compose        = { group = "io.coil-kt",         name = "coil-compose",           version.ref = "coil" }
# ML Kit for OCR
ml-kit-text         = { group = "com.google.mlkit",   name = "text-recognition",       version.ref = "mlKit" }
# WorkManager for background tasks
work-runtime        = { group = "androidx.work",      name = "work-runtime-ktx",       version.ref = "workManager" }
# Biometric authentication
biometric           = { group = "androidx.biometric", name = "biometric",              version.ref = "biometric" }
# DataStore for preferences
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStore" }
# Kotlin Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }
# Test helpers
arch-testing        = { group = "androidx.arch.core", name = "core-testing",           version.ref = "archTesting" }

[plugins]
android-application  = { id = "com.android.application",              version.ref = "androidGradlePlugin" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Added for Stash
ksp  = { id = "com.google.devtools.ksp",               version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android",        version.ref = "hilt" }
